<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para mi niña 🌌</title>

<style>

/* =========================================================
   GENERAL
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #010108;
    color: white;
    font-family: Georgia, "Times New Roman", serif;
}


/* =========================================================
   ESPACIO
========================================================= */

.galaxy {
    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 50%,
            #12082b 0%,
            #050311 45%,
            #010108 100%
        );
}


/* =========================================================
   GALAXIA PRINCIPAL
========================================================= */

.galaxia-central {

    position: absolute;

    width: 125vw;
    height: 125vw;

    max-width: 1500px;
    max-height: 1500px;

    left: 50%;
    top: 54%;

    transform:
        translate(-50%, -50%)
        rotate(0deg);

    background-image: url("galaxia.jpg");

    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;

    opacity: .72;

    filter:
        brightness(.72)
        contrast(1.2)
        saturate(1.15);

    mix-blend-mode: screen;

    animation:
        girarGalaxia 120s linear infinite;

    z-index: 1;

    pointer-events: none;
}


/* Resplandor detrás de la galaxia */

.galaxia-central::after {

    content: "";

    position: absolute;

    width: 70%;
    height: 70%;

    left: 15%;
    top: 15%;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(177, 87, 255, .20),
            transparent 65%
        );

    filter: blur(50px);

    z-index: -1;
}


/* Giro */

@keyframes girarGalaxia {

    from {

        transform:
            translate(-50%, -50%)
            rotate(0deg);

    }

    to {

        transform:
            translate(-50%, -50%)
            rotate(360deg);

    }

}


/* =========================================================
   SEGUNDA CAPA DE LUZ
========================================================= */

.luz-galaxia {

    position: absolute;

    width: 100vw;
    height: 100vw;

    max-width: 1200px;
    max-height: 1200px;

    left: 50%;
    top: 54%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(183, 104, 255, .13),
            transparent 60%
        );

    filter: blur(30px);

    animation:
        pulsoGalaxia 6s ease-in-out infinite alternate;

    z-index: 2;

    pointer-events: none;
}

@keyframes pulsoGalaxia {

    from {
        opacity: .4;
        transform:
            translate(-50%, -50%)
            scale(.95);
    }

    to {
        opacity: .9;
        transform:
            translate(-50%, -50%)
            scale(1.05);
    }

}


/* =========================================================
   ESTRELLAS PEQUEÑAS / PARTÍCULAS
========================================================= */

.particulas {

    position: absolute;

    inset: -100px;

    z-index: 4;

    background-image:

        radial-gradient(
            white 1px,
            transparent 1.5px
        ),

        radial-gradient(
            rgba(255,255,255,.8) 1px,
            transparent 1.5px
        ),

        radial-gradient(
            rgba(193,145,255,.8) 1px,
            transparent 1.5px
        );

    background-size:
        90px 90px,
        150px 150px,
        230px 230px;

    background-position:
        10px 20px,
        40px 80px,
        120px 30px;

    opacity: .7;

    animation:
        moverParticulas 80s linear infinite;

    pointer-events: none;
}

@keyframes moverParticulas {

    from {
        transform:
            translate(0,0);
    }

    to {
        transform:
            translate(-180px,-250px);
    }

}


/* =========================================================
   PARTÍCULAS ORBITANDO
========================================================= */

.orbita {

    position: absolute;

    left: 50%;
    top: 54%;

    width: 75vw;
    height: 35vw;

    max-width: 1000px;

    border: 1px solid rgba(220,180,255,.08);

    border-radius: 50%;

    transform:
        translate(-50%, -50%)
        rotate(-15deg);

    z-index: 3;

    pointer-events: none;
}

.orbita::before,
.orbita::after {

    content: "";

    position: absolute;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px white,
        0 0 18px #c084fc;

    animation:
        orbitar 12s linear infinite;
}

.orbita::before {

    left: 0;
    top: 50%;
}

.orbita::after {

    right: 0;
    top: 50%;

    animation-delay: -6s;
}

@keyframes orbitar {

    from {
        transform:
            rotate(0deg)
            translateX(37vw)
            rotate(0deg);
    }

    to {
        transform:
            rotate(360deg)
            translateX(37vw)
            rotate(-360deg);
    }

}


/* =========================================================
   LUNA
========================================================= */

.luna {

    position: absolute;

    width: 115px;
    height: 115px;

    right: 7%;
    top: 10%;

    border-radius: 50%;

    background:

        radial-gradient(
            circle at 30% 28%,
            #ffffff,
            #e8e8e8 45%,
            #b8b8b8 75%,
            #737373
        );

    box-shadow:

        0 0 20px rgba(255,255,255,.7),
        0 0 60px rgba(220,200,255,.35);

    z-index: 7;

    animation:
        lunaMovimiento 7s ease-in-out infinite;
}

.luna::before {

    content: "";

    position: absolute;

    width: 20px;
    height: 15px;

    left: 25px;
    top: 35px;

    border-radius: 50%;

    background: rgba(120,120,120,.2);

    box-shadow:
        35px 25px 0 rgba(100,100,100,.15),
        45px -15px 0 rgba(100,100,100,.12),
        10px 45px 0 rgba(100,100,100,.15);
}

@keyframes lunaMovimiento {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-15px);
    }

}


/* =========================================================
   PLANETAS
========================================================= */

.planeta {

    position: absolute;

    border-radius: 50%;

    z-index: 7;

    animation:
        planetaFlota 7s ease-in-out infinite;
}


/* Planeta rosa */

.planeta1 {

    width: 75px;
    height: 75px;

    left: 7%;
    bottom: 15%;

    background:

        radial-gradient(
            circle at 30% 25%,
            #ffc8f1,
            #bd50c9 45%,
            #52146e 80%
        );

    box-shadow:
        0 0 25px rgba(225,100,255,.5);
}

.planeta1::after {

    content: "";

    position: absolute;

    width: 125px;
    height: 32px;

    left: -25px;
    top: 21px;

    border:
        2px solid
        rgba(255,200,255,.55);

    border-radius: 50%;

    transform: rotate(-20deg);
}


/* Planeta azul */

.planeta2 {

    width: 42px;
    height: 42px;

    right: 17%;
    bottom: 20%;

    background:

        radial-gradient(
            circle at 30% 25%,
            #b7f0ff,
            #3976d4 55%,
            #15276e
        );

    box-shadow:
        0 0 25px rgba(80,160,255,.5);

    animation-delay: -3s;
}

@keyframes planetaFlota {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-17px);
    }

}


/* =========================================================
   ESTRELLAS FUGACES
========================================================= */

.estrella-fugaz {

    position: absolute;

    width: 180px;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.3),
            white
        );

    border-radius: 50%;

    transform: rotate(-35deg);

    opacity: 0;

    z-index: 8;

    pointer-events: none;

    animation:
        estrellaFugaz 8s linear infinite;
}

.estrella-fugaz::after {

    content: "";

    position: absolute;

    right: 0;

    top: -2px;

    width: 6px;
    height: 6px;

    background: white;

    border-radius: 50%;

    box-shadow:
        0 0 10px white,
        0 0 20px #d8b4fe;
}

.fugaz1 {

    left: -20%;
    top: 25%;

    animation-delay: 1s;
}

.fugaz2 {

    left: -20%;
    top: 58%;

    animation-delay: 4.5s;
}

.fugaz3 {

    left: -20%;
    top: 42%;

    animation-delay: 9s;
}

@keyframes estrellaFugaz {

    0% {
        left: -25%;
        opacity: 0;
    }

    8% {
        opacity: 1;
    }

    25% {
        left: 125%;
        opacity: 0;
    }

    100% {
        left: 125%;
        opacity: 0;
    }

}


/* =========================================================
   TÍTULO
========================================================= */

.titulo {

    position: absolute;

    width: 100%;

    top: 6%;

    text-align: center;

    z-index: 20;

    font-size:
        clamp(25px, 5vw, 48px);

    text-shadow:

        0 0 10px white,
        0 0 25px #d8b4fe,
        0 0 50px #9333ea,
        0 0 90px #7e22ce;

    animation:
        tituloBrilla 3s ease-in-out infinite alternate;
}

@keyframes tituloBrilla {

    from {
        opacity: .75;
    }

    to {
        opacity: 1;
    }

}


/* =========================================================
   ESTRELLAS INTERACTIVAS
========================================================= */

.estrella {

    position: absolute;

    width: 17px;
    height: 17px;

    background: white;

    border-radius: 50%;

    cursor: pointer;

    z-index: 30;

    box-shadow:

        0 0 8px white,
        0 0 20px #e9d5ff,
        0 0 40px #a855f7;

    animation:
        brilloEstrella 2s ease-in-out infinite alternate,
        flotarEstrella 4s ease-in-out infinite;

    transition:
        transform .3s ease;
}

.estrella::before {

    content: "✦";

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    font-size: 34px;

    color: white;

    text-shadow:

        0 0 10px white,
        0 0 25px #d8b4fe,
        0 0 45px #a855f7;
}

.estrella:hover {

    transform:
        scale(1.5);
}

@keyframes brilloEstrella {

    from {
        opacity: .55;
        filter: brightness(.8);
    }

    to {
        opacity: 1;
        filter: brightness(2);
    }

}

@keyframes flotarEstrella {

    0%,100% {
        margin-top: 0;
    }

    50% {
        margin-top: -8px;
    }

}


/* =========================================================
   POSICIONES DE LAS 7 ESTRELLAS
========================================================= */

#estrella1 {
    top: 28%;
    left: 24%;
}

#estrella2 {
    top: 36%;
    left: 72%;
}

#estrella3 {
    top: 53%;
    left: 25%;
}

#estrella4 {
    top: 65%;
    left: 69%;
}

#estrella5 {
    top: 72%;
    left: 48%;
}

#estrella6 {
    top: 44%;
    left: 48%;
}

#estrella7 {
    top: 25%;
    left: 81%;
}


/* =========================================================
   ESTRELLA SECRETA
========================================================= */

#estrellaSecreta {

    top: 50%;
    left: 88%;

    display: none;

    background: #ffd9ff;

    box-shadow:

        0 0 15px white,
        0 0 40px #ff72dc,
        0 0 80px #ff20c8;

    animation:
        estrellaSecreta 1.5s ease-in-out infinite alternate;
}

@keyframes estrellaSecreta {

    from {
        transform: scale(.8);
    }

    to {
        transform: scale(1.4);
    }

}


/* =========================================================
   CONSTELACIONES
========================================================= */

.constelacion {

    position: absolute;

    width: 180px;
    height: 130px;

    z-index: 5;

    opacity: .3;

    pointer-events: none;
}

.constelacion span {

    position: absolute;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 7px white;
}

.constelacion::after {

    content: "";

    position: absolute;

    inset: 0;

    background:

        linear-gradient(
            25deg,
            transparent 49%,
            rgba(255,255,255,.4) 50%,
            transparent 51%
        ),

        linear-gradient(
            150deg,
            transparent 49%,
            rgba(255,255,255,.4) 50%,
            transparent 51%
        );
}


/* Constelación izquierda */

.constelacion1 {

    left: 5%;
    top: 35%;
}

.constelacion1 .c1 {
    left: 10%;
    top: 20%;
}

.constelacion1 .c2 {
    left: 35%;
    top: 50%;
}

.constelacion1 .c3 {
    left: 55%;
    top: 20%;
}

.constelacion1 .c4 {
    left: 75%;
    top: 65%;
}

.constelacion1 .c5 {
    left: 90%;
    top: 35%;
}


/* Constelación derecha */

.constelacion2 {

    right: 5%;
    top: 55%;

    transform: rotate(25deg);
}

.constelacion2 .c1 {
    left: 10%;
    top: 20%;
}

.constelacion2 .c2 {
    left: 30%;
    top: 50%;
}

.constelacion2 .c3 {
    left: 55%;
    top: 25%;
}

.constelacion2 .c4 {
    left: 75%;
    top: 70%;
}

.constelacion2 .c5 {
    left: 95%;
    top: 40%;
}


/* =========================================================
   TARJETA DE MENSAJES
========================================================= */

.card {

    position: fixed;

    left: 50%;
    top: 50%;

    width:
        min(90%, 470px);

    max-height: 80vh;

    overflow-y: auto;

    padding: 32px;

    border-radius: 25px;

    background:

        linear-gradient(
            135deg,
            rgba(35,10,60,.97),
            rgba(5,2,18,.98)
        );

    border:
        1px solid
        rgba(255,255,255,.25);

    box-shadow:

        0 0 30px
        rgba(168,85,247,.5),

        0 0 100px
        rgba(168,85,247,.25);

    backdrop-filter:
        blur(20px);

    text-align: center;

    opacity: 0;

    pointer-events: none;

    transform:
        translate(-50%,-50%)
        scale(.7);

    transition:
        .45s cubic-bezier(.17,.67,.3,1.3);

    z-index: 100;
}

.card.activa {

    opacity: 1;

    pointer-events: auto;

    transform:
        translate(-50%,-50%)
        scale(1);
}


/* =========================================================
   TEXTO TARJETA
========================================================= */

.card h2 {

    margin-bottom: 18px;

    font-size: 28px;

    color: white;

    text-shadow:

        0 0 10px #d8b4fe,
        0 0 25px #9333ea;
}

.card p {

    font-size: 17px;

    line-height: 1.7;

    color: #eeeeee;
}


/* =========================================================
   IMÁGENES
========================================================= */

.card img {

    width: 100%;

    max-height: 280px;

    object-fit: cover;

    border-radius: 18px;

    margin-bottom: 18px;

    box-shadow:

        0 0 25px
        rgba(168,85,247,.4);
}


/* =========================================================
   CERRAR
========================================================= */

.cerrar {

    position: absolute;

    right: 12px;
    top: 10px;

    width: 36px;
    height: 36px;

    border: none;

    border-radius: 50%;

    background:
        rgba(255,255,255,.08);

    color: white;

    font-size: 23px;

    cursor: pointer;

    transition: .3s;
}

.cerrar:hover {

    background:
        rgba(255,255,255,.2);

    transform:
        rotate(90deg);
}


/* =========================================================
   BOTÓN DE MÚSICA
========================================================= */

.musica {

    position: absolute;

    left: 20px;
    top: 20px;

    width: 48px;
    height: 48px;

    border: 1px solid
        rgba(255,255,255,.2);

    border-radius: 50%;

    background:
        rgba(255,255,255,.08);

    backdrop-filter:
        blur(10px);

    color: white;

    font-size: 19px;

    cursor: pointer;

    z-index: 50;

    box-shadow:
        0 0 20px
        rgba(180,120,255,.25);
}


/* =========================================================
   TEXTO INFERIOR
========================================================= */

.instruccion {

    position: absolute;

    bottom: 4%;

    width: 100%;

    text-align: center;

    color:
        rgba(255,255,255,.65);

    font-size: 14px;

    z-index: 20;

    animation:
        instruccion 2s ease-in-out infinite alternate;
}

@keyframes instruccion {

    from {
        opacity: .35;
    }

    to {
        opacity: 1;
    }
}


/* =========================================================
   RESPONSIVE CELULAR
========================================================= */

@media (max-width: 600px) {

    .galaxia-central {

        width: 180vw;
        height: 180vw;

        top: 54%;

        opacity: .65;
    }

    .luz-galaxia {

        width: 150vw;
        height: 150vw;
    }

    .luna {

        width: 70px;
        height: 70px;

        right: 7%;
        top: 14%;
    }

    .planeta1 {

        width: 48px;
        height: 48px;

        left: 5%;
        bottom: 14%;
    }

    .planeta1::after {

        width: 80px;

        left: -16px;

        top: 13px;
    }

    .planeta2 {

        width: 32px;
        height: 32px;
    }

    .titulo {

        top: 7%;

        font-size: 28px;
    }

    .estrella {

        width: 13px;
        height: 13px;
    }

    .estrella::before {

        font-size: 27px;
    }

    .card {

        width: 90%;

        padding: 28px 22px;
    }

    .card h2 {

        font-size: 24px;
    }

    .card p {

        font-size: 16px;
    }

}


/* =========================================================
   PANTALLAS MUY PEQUEÑAS
========================================================= */

@media (max-height: 600px) {

    .titulo {
        top: 4%;
    }

    .instruccion {
        bottom: 2%;
    }

    .luna {
        width: 65px;
        height: 65px;
    }

}

</style>
</head>

        titulo:

    },

        texto:
            "Quizá no siempre encuentro las palabras correctas para decirte todo lo que siento, pero espero que este pequeño detalle te pueda mostrar cuánto te amo."

    },


    6: {

        titulo:
            "Una promesa ⭐",

        imagen:
            "foto2.jpg",

        texto:
            "Quiero seguir creando recuerdos contigo, tener una niña con tus hermosos ojos y tu sonrisa tan preciosa, esa que cada dia me da inspiracion para darte todo lo que te mereces."

    },

        titulo:
            "Antes de irte... 🌌",

    }

};


/* =========================================================
   SISTEMA DE ESTRELLAS
========================================================= */

let estrellasVisitadas = [];


/* =========================================================
   ABRIR MENSAJE
========================================================= */

function abrirCarta(numero) {


    const card =
        document.getElementById("card");


    const contenido =
        document.getElementById("contenido");


    const mensaje =
        mensajes[numero];


    /* Registrar estrella */

    if (
        numero !== 8 &&
        !estrellasVisitadas.includes(numero)
    ) {

        estrellasVisitadas.push(numero);

    }


    /* Crear contenido */

    let html = `

        <h2>
            ${mensaje.titulo}
        </h2>

    `;


    if (mensaje.imagen) {

        html += `

            <img
                src="${mensaje.imagen}"
                alt="Recuerdo">

        `;

    }


    html += `

        <p>
            ${mensaje.texto}
        </p>

    `;


    contenido.innerHTML = html;


    /* Mostrar tarjeta */

    card.classList.add("activa");


    /* =====================================================
       DESBLOQUEAR ESTRELLA SECRETA
    ====================================================== */

    if (estrellasVisitadas.length >= 7) {

        document
            .getElementById("estrellaSecreta")
            .style.display = "block";

    }

}


/* =========================================================
   CERRAR
========================================================= */

function cerrarCarta() {

    document
        .getElementById("card")
        .classList.remove("activa");

}


/* =========================================================
   MÚSICA
========================================================= */

const musica =
    document.getElementById("musicaFondo");


const botonMusica =
    document.getElementById("botonMusica");


let reproduciendo = false;


/* =========================================================
   CONTROL DE MÚSICA
========================================================= */

function toggleMusica() {


    if (!reproduciendo) {


        musica.play()
            .then(() => {

                reproduciendo = true;

                botonMusica.innerHTML = "🔊";

            })
            .catch(() => {

                alert(
                    "Haz clic otra vez para reproducir la música 🎵"
                );

            });


    } else {


        musica.pause();

        reproduciendo = false;

        botonMusica.innerHTML = "🔇";

    }

}


/* =========================================================
   INTENTAR INICIAR MÚSICA CON EL PRIMER CLICK
========================================================= */

document.addEventListener(
    "click",
    function iniciarMusica() {


        if (!reproduciendo) {


            musica.play()
                .then(() => {

                    reproduciendo = true;

                    botonMusica.innerHTML = "🔊";

                })
                .catch(() => {});


        }


        document.removeEventListener(
            "click",
            iniciarMusica
        );


    }
);


/* =========================================================
   CERRAR CON ESC
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {


        if (event.key === "Escape") {

            cerrarCarta();

        }


    }
);

</script>
